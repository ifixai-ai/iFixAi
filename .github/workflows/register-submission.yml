name: Register submission

# Submissions to the public register are pull requests that add or change a file under register/.
# This check is what stands between a submission and the register, so it runs on the pull request
# and is the thing a reviewer reads before merging.
#
# It needs no secret and no network beyond the checkout: the report format is runtime-neutral, so a
# report is checkable on a laptop with no API key, and so is checkable here.
on:
  pull_request:
    paths:
      - "register/**"
      - "ifixai/register/**"
      - "ifixai/schemas/misbehaviour-report-*.schema.json"
      - "scripts/check_register_submission.py"
      - ".github/workflows/register-submission.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits so the diff against the base is available without a full history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Schema matches the model
        # The JSON Schema is generated from ifixai/register/spec.py. Two statements of one format
        # drift, and the one submissions are checked against must be the one the library enforces.
        run: python scripts/generate_register_schema.py --check

      - name: Register files that changed
        id: changed
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" || true
          files="$(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- 'register/**/*.yaml' || true)"
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$files" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if [ -z "$files" ]; then
            echo "No register files changed."
          else
            echo "Checking:"; echo "$files"
          fi

      - name: Check the submission
        # Schema conformance, every cross-field rule, calibration present, de-identified and
        # rights-cleared for an audit-derived report, no leftover placeholders, correct placement,
        # and duplicate behaviour signatures flagged against the whole register. A failure writes a
        # readable reason naming the field, into the job summary as well as the log.
        run: |
          set -euo pipefail
          files="${{ steps.changed.outputs.files }}"
          if [ -z "$files" ]; then
            echo "Nothing to check."
            exit 0
          fi
          # shellcheck disable=SC2086
          python scripts/check_register_submission.py $files

      - name: The whole register still validates
        # A submission that passes on its own but breaks an invariant across the register (a
        # duplicate file name, an unparseable neighbour) is caught here.
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(register/entries/*.yaml register/candidates/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "The register is empty."
            exit 0
          fi
          ifixai report validate "${files[@]}"

      - name: Register tests
        run: pytest ifixai/tests/register -q
