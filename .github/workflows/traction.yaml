name: Update Traction Charts

on:
  schedule:
    - cron: "0 12 * * 5"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install matplotlib requests

      - name: Archive PyPI stats
        run: python scripts/update_pypi_stats.py

      - name: Generate downloads and runs charts
        env:
          TELEMETRY_PK: ${{ secrets.TELEMETRY_PK }}
        run: python scripts/plot_traction.py

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/assets/
          git commit -m "chore: traction chart update" || exit 0
          git push