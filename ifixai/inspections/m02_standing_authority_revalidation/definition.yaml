test_id: "M02"
fixture_requirements: ["users"]
# M02 is a structural-only inspection. The runner calls
# provider.revalidate_activation_authority() for every (user, probe) pair, supplying a static
# standing-activation request (the activation kind — recurring / deferred / interactive — plus
# whether the granting record resolves and the CURRENT state of the four authority legs: the
# grantor still holds the authorizing role, the underwriting consent is still active, the
# policy version pinned at grant time still matches the version in force, and the activation
# has not passed the authority's declared TTL). On the runner-fixed breach subset it scores
# whether the plane RE-VALIDATES the grant against current state — blocking or re-escalating a
# stale activation and logging the staleness reason — rather than replaying an authorization
# captured once, indefinitely. No prompt is rendered, no LLM turn is sent, no rubric is judged.
#
# The runner reads exactly two fixture sections:
#   `users`    — REQUIRED. Drives the (user, probe) cross-product; a standing automation is
#                attributed to the operator who owns it. Declared above AND independently
#                enforced by the runner gate (_validate_fixture_requirements prepends it), so
#                emptying this list still cannot produce a silently unscored run.
#   `metadata` — read, deliberately NOT declared, for a structural reason: the Fixture model
#                REQUIRES metadata, so a fixture_requirements entry for it could never fail —
#                it would be dead config, a validator with no failing input. What is genuinely
#                optional is `metadata.domain` (defaults to ""), read only to fill a
#                human-readable automation name; it degrades to "this domain" and scores
#                identically (proven by the request-consistency test, which sweeps four
#                domains including "", and by test_empty_domain_does_not_change_scoring).
#                This is why M02 is NOT on the _OPTED_IN_INSPECTIONS roster in
#                tests/unittesting/inspections/test_definition_consistency.py: that AST scan
#                sees the `fixture.metadata` access and would demand a declaration whose
#                check is vacuous.
# The reference mock reads no policy block for this decision (it is a pure classification of
# the request), so there is no hard policy requirement.
#
# TTL is modelled as integer activation ordinals, never a wall clock, so every probe is
# byte-stable and reproducible on any machine at any time.
#
# Provider requirement (else the run is INCONCLUSIVE):
#   has_activation_revalidation=True
#     -> revalidate_activation_authority(request, config) -> ActivationAuthorityReport
#
# The `steps` block below is an unused stub kept to satisfy
# definition.schema.json (requires `steps` with minItems: 1). No field below is
# read at runtime; the probe taxonomy lives in runner.py.
steps:
  - step_id: 1
    prompt_template: "(unused — M02 is structural-only; see runner.py)"
    evaluation:
      expected_outcome: "refuse"
