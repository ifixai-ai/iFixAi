# iFixAi self-check for GitLab CI.
#
# Include it and set IFIXAI_AGENT_URL to a test deployment's chat endpoint:
#
#   include:
#     - remote: <raw URL of this file>   # or copy it into your repository
#   variables:
#     IFIXAI_AGENT_URL: https://staging.example.com/v1
#     IFIXAI_CONFIRM_SANDBOXED: "true"   # required: the URL has sandboxed backends and no real data
#
# The job runs `ifixai audit`, prints the plain verdict, fails on any failure
# (or only on pinned regressions, with IFIXAI_FAIL_ON: regressions), and keeps
# self-check.json, the report, the SARIF file and the merge-request comment as
# artifacts. Set IFIXAI_MR_COMMENT_TOKEN (a project access token with `api`
# scope, masked) to post the verdict on the merge request.
#
# The result is a self-check: not certified, never a badge. A judge runs only on
# provider keys you put in the job's variables (your keys, your cost); without
# one only structural checks run.

variables:
  IFIXAI_PACKAGE: "ifixai"
  IFIXAI_SUITE: "smoke"
  IFIXAI_FAIL_ON: "any"
  IFIXAI_JUDGE_PROVIDER: ""
  IFIXAI_CONFIRM_SANDBOXED: "false"

ifixai-self-check:
  stage: test
  image: python:3.12-slim
  rules:
    - if: $IFIXAI_AGENT_URL
  before_script:
    - python -m pip install --disable-pip-version-check --quiet "$IFIXAI_PACKAGE"
    - ifixai audit --help > /dev/null || { echo "This ifixai has no 'audit' command (IFIXAI_PACKAGE=$IFIXAI_PACKAGE)."; exit 1; }
  script:
    - |
      set -eu
      set -- audit "$IFIXAI_AGENT_URL" --suite "$IFIXAI_SUITE" --fail-on "$IFIXAI_FAIL_ON" \
        --sarif ifixai-self-check.sarif --comment ifixai-self-check.md
      if [ "$IFIXAI_CONFIRM_SANDBOXED" = "true" ]; then set -- "$@" --yes; fi
      if [ -n "$IFIXAI_JUDGE_PROVIDER" ]; then set -- "$@" --judge-provider "$IFIXAI_JUDGE_PROVIDER"; fi
      status=0
      ifixai "$@" < /dev/null || status=$?
      if [ -f ifixai-self-check.md ] && [ -n "${IFIXAI_MR_COMMENT_TOKEN:-}" ] && [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then
        python - <<'PY'
      import json, os, urllib.request
      body = open("ifixai-self-check.md", encoding="utf-8").read()
      url = f"{os.environ['CI_API_V4_URL']}/projects/{os.environ['CI_PROJECT_ID']}/merge_requests/{os.environ['CI_MERGE_REQUEST_IID']}/notes"
      request = urllib.request.Request(url, data=json.dumps({"body": body}).encode(), method="POST",
          headers={"PRIVATE-TOKEN": os.environ["IFIXAI_MR_COMMENT_TOKEN"], "Content-Type": "application/json"})
      urllib.request.urlopen(request, timeout=30).read()
      print("Posted the verdict on the merge request.")
      PY
      fi
      exit "$status"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .ifixai/self-check/
      - ifixai-self-check.sarif
      - ifixai-self-check.md
